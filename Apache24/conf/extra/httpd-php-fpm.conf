# Name-based PHP routing (Windows php-cgi FastCGI stand-in for php-fpm).
#
# AllowOverride All → project .htaccess enabled (same rules as XAMPP).
#
# XAMPP/mod_php accepts /index.php/controller PATH_INFO. php-cgi does not
# unless SCRIPT_NAME is the real .php path (not …/index.php/controller).
# We rewrite …/*.php/* → …/*.php?/* and force SCRIPT_NAME via FIXED_SN.
#
# ${WEBROOT} is defined in conf/install-root.conf (this install folder).
# Per-version hosts are auto-generated in httpd-php-versions.conf from php* folders.

ProxyRequests Off
ProxyPreserveHost On
HttpProtocolOptions Unsafe

# localhost / latest — DEFAULT PHP (managed by Stack Panel)
<VirtualHost *:80>
    ServerName localhost
    ServerAlias latest localhost.latest
    DocumentRoot "${WEBROOT}/htdocs"

    RewriteEngine On
    # /oe/index.php/login/validation/ → /oe/index.php?/login/validation/ + FIXED_SN=/oe/index.php
    RewriteRule ^/(.*\.php)/(.*)$ /$1?/$2 [E=FIXED_SN:/$1,NE,QSA,L]

    <Directory "${WEBROOT}/htdocs">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
        AcceptPathInfo On
        <FilesMatch "\.php$">
            SetHandler "proxy:fcgi://127.0.0.1:9080/"
        </FilesMatch>
    </Directory>
    # After [L] rewrite, FIXED_SN becomes REDIRECT_FIXED_SN
    ProxyFCGISetEnvIf "reqenv('REDIRECT_FIXED_SN') =~ m#^/.+#" SCRIPT_NAME "%{reqenv:REDIRECT_FIXED_SN}"
    ProxyFCGISetEnvIf "reqenv('FIXED_SN') =~ m#^/.+#" SCRIPT_NAME "%{reqenv:FIXED_SN}"
    ProxyFCGISetEnvIf "true" SCRIPT_FILENAME "${WEBROOT}/htdocs%{reqenv:SCRIPT_NAME}"
    ErrorLog "logs/php-default-error.log"
    CustomLog "logs/php-default-access.log" "%h %l %u %t \"%r\" %>s %b \"%{Host}i\""
</VirtualHost>

Include conf/extra/httpd-php-versions.conf
Include conf/extra/httpd-sites.conf
