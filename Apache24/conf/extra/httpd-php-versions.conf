# Auto-generated by PatilWeb CPanel from php* folders — do not edit by hand.
# Regenerated when the panel loads or a PHP version is installed.

# PHP 8.0.30 (php8.0.30)
<VirtualHost *:80>
    ServerName php80
    ServerAlias localhost80 localhost.php80
    DocumentRoot "${WEBROOT}/htdocs"
    RewriteEngine On
    RewriteRule ^/(.*\.php)/(.*)$ /$1?/$2 [E=FIXED_SN:/$1,NE,QSA,L]
    <Directory "${WEBROOT}/htdocs">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
        AcceptPathInfo On
        <FilesMatch "\.php$">
            SetHandler "proxy:fcgi://127.0.0.1:9080/"
        </FilesMatch>
    </Directory>
    ProxyFCGISetEnvIf "reqenv('REDIRECT_FIXED_SN') =~ m#^/.+#" SCRIPT_NAME "%{reqenv:REDIRECT_FIXED_SN}"
    ProxyFCGISetEnvIf "reqenv('FIXED_SN') =~ m#^/.+#" SCRIPT_NAME "%{reqenv:FIXED_SN}"
    ProxyFCGISetEnvIf "true" SCRIPT_FILENAME "${WEBROOT}/htdocs%{reqenv:SCRIPT_NAME}"
    ErrorLog "logs/php80-error.log"
    CustomLog "logs/php80-access.log" "%h %l %u %t \"%r\" %>s %b \"%{Host}i\""
</VirtualHost>

